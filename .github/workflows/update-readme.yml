name: Update LeetCode Progress

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Count problems
        run: |
          EASY=$(find ./Easy -type f | wc -l)
          MEDIUM=$(find ./Medium -type f | wc -l)
          HARD=$(find ./Hard -type f | wc -l)

          echo "EASY=$EASY" >> $GITHUB_ENV
          echo "MEDIUM=$MEDIUM" >> $GITHUB_ENV
          echo "HARD=$HARD" >> $GITHUB_ENV

      - name: Update README
        run: |
          sed -i "s/EASY_COUNT/$EASY/" README.md
          sed -i "s/MEDIUM_COUNT/$MEDIUM/" README.md
          sed -i "s/HARD_COUNT/$HARD/" README.md

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Auto update problem count" || echo "No changes"
          git push
